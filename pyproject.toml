[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xoxss"
version = "2.0.0"
description = "Advanced, context-aware, persistent XSS scanner for authorized security testing"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "mraashish0x1" }]
keywords = ["xss", "security", "scanner", "web", "vulnerability", "pentest"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "aiohttp>=3.9.5",
    "beautifulsoup4>=4.12.3",
    "selenium>=4.22.0",
    "webdriver-manager>=4.0.1",
    "uvloop>=0.19.0; sys_platform != 'win32'",
]

[project.optional-dependencies]
interactsh = ["cryptography>=42"]
playwright = ["playwright>=1.40"]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pyright>=1.1.350",
]

[project.scripts]
xoxss = "xoxss.scanner:main"

[project.urls]
Source = "https://github.com/gl1tch0x1/xoxss"

[tool.setuptools]
include-package-data = true
package-data = { "xoxss" = ["data/*.txt", "data/*.md"] }

[tool.setuptools.packages.find]
include = ["xoxss*"]
exclude = ["tests*", "examples*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
