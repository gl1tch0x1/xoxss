[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xoxss"
version = "2.0.0"
description = "Advanced, context-aware, persistent XSS scanner for authorized security testing"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "mraashish0x1" }]
keywords = ["xss", "security", "scanner", "web", "vulnerability", "pentest"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "aiohttp>=3.9.5",
    "aiodns>=3.2.0",
    "beautifulsoup4>=4.12.3",
    "selenium>=4.22.0",
    "webdriver-manager>=4.0.1",
    "uvloop>=0.19.0; sys_platform != 'win32'",
]

[project.optional-dependencies]
interactsh = ["cryptography>=42"]
playwright = ["playwright>=1.40"]
http2 = ["curl_cffi>=0.7"]
ast = ["tree-sitter>=0.23", "tree-sitter-javascript>=0.23"]
dev = [
    "pyright>=1.1.350",
    "ruff>=0.6",
]

[project.scripts]
xoxss = "xoxss.scanner:main"

[project.urls]
Source = "https://github.com/gl1tch0x1/xoxss"

[tool.setuptools]
include-package-data = true
package-data = { "xoxss" = ["data/*.txt", "data/*.md"] }

[tool.setuptools.packages.find]
include = ["xoxss*"]
exclude = ["tests*", "examples*"]

[tool.ruff]
target-version = "py39"
line-length = 100
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = [
    "E501",  # line length is handled by the formatter, not the linter
]

[tool.ruff.lint.per-file-ignores]
# Standalone verification scripts adjust sys.path before importing xoxss.
"benchmarks/test_*.py" = ["E402"]

