[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xoxss"
version = "2.1.0"
description = "Advanced, context-aware, persistent XSS scanner for authorized security testing"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "mraashish0x1" }]
keywords = ["xss", "security", "scanner", "web", "vulnerability", "pentest"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]
dependencies = [
    "aiohttp>=3.9.5",
    "aiodns>=3.2.0",
    "beautifulsoup4>=4.12.3",
    "uvloop>=0.19.0; sys_platform != 'win32'",
]

[project.optional-dependencies]
# Browser verification is optional: HTTP-only scans work without a driver.
browser = ["selenium>=4.22.0", "webdriver-manager>=4.0.1"]
interactsh = ["cryptography>=42"]
playwright = ["playwright>=1.40"]
http2 = ["curl_cffi>=0.7"]
ast = ["tree-sitter>=0.23", "tree-sitter-javascript>=0.23"]
dev = [
    "pyright>=1.1.350",
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "selenium>=4.22.0",
    "webdriver-manager>=4.0.1",
]

[project.scripts]
xoxss = "xoxss.scanner:main"

[project.urls]
Homepage = "https://github.com/gl1tch0x1/xoxss"
Repository = "https://github.com/gl1tch0x1/xoxss"
Issues = "https://github.com/gl1tch0x1/xoxss/issues"
Changelog = "https://github.com/gl1tch0x1/xoxss/blob/main/CHANGELOG.md"
Documentation = "https://github.com/gl1tch0x1/xoxss#readme"
Security = "https://github.com/gl1tch0x1/xoxss/blob/main/docs/SECURITY.md"

[tool.setuptools]
include-package-data = true
package-data = { "xoxss" = ["data/*.txt", "data/*.md", "py.typed"] }

[tool.setuptools.packages.find]
include = ["xoxss*"]
exclude = ["tests*", "examples*"]

[tool.ruff]
target-version = "py39"
line-length = 100
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "ASYNC", "RUF", "C90"]
ignore = [
    "E501",  # line length is handled by the formatter, not the linter
    # Ambiguous-unicode style rules are noisy in prose/docstrings and do not
    # indicate a defect.  Mutable class defaults are a real risk but require a
    # dedicated ClassVar sweep; tracked separately instead of hiding the rest
    # of RUF behind a blanket ignore.
    "RUF001",
    "RUF002",
    "RUF012",
]

[tool.ruff.lint.mccabe]
# Ratchet: flag only genuine monoliths today (the scanner's longest methods).
# New functions above this threshold fail CI; the ceiling comes down as the
# scanner is decomposed.
max-complexity = 40

[tool.ruff.lint.per-file-ignores]
# Standalone verification scripts adjust sys.path before importing xoxss.
"benchmarks/test_*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # Deprecations stay visible in the log, but only a genuine failure should
    # break the suite.  A module-scoped `error::DeprecationWarning:xoxss.*`
    # rule used to fail the run whenever a dependency deprecated an API from
    # inside our call stack.
    "ignore:enable_cleanup_closed ignored.*:DeprecationWarning",
]

[tool.coverage.run]
source = ["xoxss"]
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
# Ratchet: slightly below the measured total so refactors cannot silently drop
# coverage while new code is still being test-covered module by module.
# Measured 2026-11: 40.7% total (39.9% before god-mode coverage; 38.4% before
# the dangling-markup, CRLF, CSP and DOM-sink work; 30.9% at the audit baseline).
fail_under = 40
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

