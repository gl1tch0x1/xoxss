name: Release

"on":
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  binaries:
    name: Build binary (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: xoxss-x86_64-pc-windows-msvc.exe
          - os: ubuntu-latest
            asset: xoxss-x86_64-unknown-linux-gnu
          - os: macos-latest
            asset: xoxss-aarch64-apple-darwin
          - os: macos-13
            asset: xoxss-x86_64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pyinstaller

      - name: Build standalone binary
        run: python -m PyInstaller packaging/xoxss.spec --noconfirm --distpath dist-bin --workpath build

      - name: Stage release asset
        shell: bash
        run: |
          mkdir -p artifacts
          if [ -f dist-bin/xoxss.exe ]; then
            cp dist-bin/xoxss.exe "artifacts/${{ matrix.asset }}"
          else
            cp dist-bin/xoxss "artifacts/${{ matrix.asset }}"
          fi
          chmod +x "artifacts/${{ matrix.asset }}" || true

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.asset }}
          path: artifacts/*

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build, binaries]
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          pattern: bin-*
          path: binaries
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            binaries/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: "pypi"
      url: https://pypi.org/project/xoxss/
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
