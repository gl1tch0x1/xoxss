name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Import and CLI surface
        run: |
          python -m compileall -q xoxss xoxss.py
          python -m xoxss --version
          python -m xoxss --list-encoders >/dev/null
          python -m xoxss --list-tampers >/dev/null
          python -m xoxss --doctor || true

      - name: Static type checks
        run: pyright

      - name: Tests
        run: python -m pytest tests -q

      - name: Local integration smoke
        run: python tests/integration_smoke.py

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Import and CLI surface
        run: |
          python -m compileall -q xoxss xoxss.py
          python -m xoxss --version
          python -m xoxss --list-encoders | Out-Null
          python -m xoxss --list-tampers | Out-Null
      - name: Tests
        run: python -m pytest tests -q
