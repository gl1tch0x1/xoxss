name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest is Ubuntu 26.04, which no longer ships a 3.9 build;
        # keep the oldest supported interpreter on the 22.04 image so the
        # declared `requires-python = ">=3.9"` stays covered.
        include:
          - python-version: "3.9"
            os: ubuntu-22.04
          - python-version: "3.10"
            os: ubuntu-latest
          - python-version: "3.11"
            os: ubuntu-latest
          - python-version: "3.12"
            os: ubuntu-latest
          - python-version: "3.13"
            os: ubuntu-latest
          - python-version: "3.14"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Import and CLI surface
        run: |
          python -m compileall -q xoxss xoxss.py tests
          python -m xoxss --version
          python -m xoxss --list-encoders >/dev/null
          python -m xoxss --list-tampers >/dev/null
          python -m xoxss --doctor

      - name: Unit tests
        run: pytest --cov=xoxss --cov-report=term-missing

      - name: Static type checks
        run: pyright

      - name: Lint
        run: ruff check xoxss tests benchmarks

      - name: DOM false-positive guards
        run: python benchmarks/test_dom_guards.py

      - name: Hybrid pipeline suite
        run: python benchmarks/test_hybrid_pipeline.py

      - name: Coverage benchmark (HTTP-only)
        run: python benchmarks/run_benchmark.py --quick

  browser-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install with Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,playwright]"
          python -m playwright install --with-deps chromium

      - name: Browser benchmark (full case set)
        run: python benchmarks/run_benchmark.py

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Import and CLI surface
        run: |
          python -m compileall -q xoxss xoxss.py tests
          python -m xoxss --version
          python -m xoxss --list-encoders | Out-Null
          python -m xoxss --list-tampers | Out-Null
      - name: Unit tests
        run: pytest
      - name: Coverage benchmark (HTTP-only)
        run: python benchmarks/run_benchmark.py --quick
